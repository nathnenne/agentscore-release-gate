# TSK_123 — AgentScore CLI release-gate MVP.
#
# Stand-alone Python package that lives alongside the backend repo
# (chosen because the backend toolchain is already Python; documented
# in RES_123). A future task can promote this to a separate
# `agentscore-cli` GitHub repo without API changes.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentscore-cli"
version = "0.1.0"
description = "AgentScore release-gate CLI for developer-led CI/CD workflows."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "AgentScore" }]
dependencies = [
    "httpx>=0.27,<0.29",
    "PyYAML>=6.0,<7.0",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10.0",
    "respx>=0.21,<0.23",
]

[project.scripts]
agentscore = "agentscore_cli.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agentscore_cli = ["py.typed"]
